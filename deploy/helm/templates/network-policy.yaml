{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zechbur.fullname" . }}-default-deny
  labels:
    {{- include "zechbur.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zechbur.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zechbur.fullname" . }}-application
  labels:
    {{- include "zechbur.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zechbur.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 8000}
    - from:
        - podSelector:
            matchLabels:
              {{- include "zechbur.selectorLabels" . | nindent 14 }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "zechbur.selectorLabels" . | nindent 14 }}
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
        - {protocol: TCP, port: 443}
{{- end }}
