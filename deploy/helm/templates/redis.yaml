{{- if .Values.redis.internal }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zechbur.redisHost" . }}
  labels:
    {{- include "zechbur.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  ports: [{name: redis, port: 6379, targetPort: redis}]
  selector:
    {{- include "zechbur.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zechbur.fullname" . }}-redis
  labels:
    {{- include "zechbur.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "zechbur.redisHost" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "zechbur.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "zechbur.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          args: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe: {exec: {command: ["redis-cli", "ping"]}, periodSeconds: 10}
          livenessProbe: {exec: {command: ["redis-cli", "ping"]}, periodSeconds: 20}
          resources: {{ toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.redis.storage.storageClass }}
        storageClassName: {{ .Values.redis.storage.storageClass | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.redis.storage.size }}}}
{{- end }}
