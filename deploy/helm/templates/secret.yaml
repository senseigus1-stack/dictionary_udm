{{- if not .Values.secrets.existingSecret }}
{{- $name := printf "%s-secrets" (include "zechbur.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $appSecret := randAlphaNum 48 }}
{{- $botSecret := randAlphaNum 48 }}
{{- $pgPassword := randAlphaNum 32 }}
{{- if $existing }}
{{- $appSecret = index $existing.data "APP_SECRET" | b64dec }}
{{- $botSecret = index $existing.data "TELEGRAM_BOT_SECRET" | b64dec }}
{{- $pgPassword = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- end }}
{{- if .Values.secrets.appSecret }}{{- $appSecret = .Values.secrets.appSecret }}{{- end }}
{{- if .Values.secrets.telegramBotSecret }}{{- $botSecret = .Values.secrets.telegramBotSecret }}{{- end }}
{{- if .Values.database.password }}{{- $pgPassword = .Values.database.password }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "zechbur.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_SECRET: {{ $appSecret | quote }}
  TELEGRAM_BOT_TOKEN: {{ .Values.secrets.telegramBotToken | quote }}
  TELEGRAM_BOT_SECRET: {{ $botSecret | quote }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  {{- if .Values.secrets.externalDatabaseUrl }}
  DATABASE_URL: {{ .Values.secrets.externalDatabaseUrl | quote }}
  {{- else }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s:5432/%s" .Values.database.user $pgPassword (include "zechbur.databaseHost" .) .Values.database.name | quote }}
  {{- end }}
  {{- if .Values.secrets.externalRedisUrl }}
  REDIS_URL: {{ .Values.secrets.externalRedisUrl | quote }}
  {{- else }}
  REDIS_URL: {{ printf "redis://%s:6379/0" (include "zechbur.redisHost" .) | quote }}
  {{- end }}
{{- end }}
