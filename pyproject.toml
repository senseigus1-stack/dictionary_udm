[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zechbur"
version = "2.0.0rc1"
description = "Удмуртский словарь и тренажёр языка с интервальными повторениями"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.15,<4",
  "alembic>=1.14,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "fastapi[standard]>=0.115,<1",
  "httpx>=0.28,<1",
  "prometheus-fastapi-instrumentator>=7,<8",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "redis>=5.2,<7",
  "SQLAlchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
zechbur = "app.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "bot"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
