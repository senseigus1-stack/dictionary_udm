name: zechbur

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: udmurt
      POSTGRES_USER: udmurt
      POSTGRES_PASSWORD: udmurt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udmurt -d udmurt"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://udmurt:udmurt@postgres:5432/udmurt
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "8000:8000"
    restart: unless-stopped

  bot:
    build: .
    command: ["bot"]
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["telegram"]

  worker:
    build: .
    command: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://udmurt:udmurt@postgres:5432/udmurt
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
